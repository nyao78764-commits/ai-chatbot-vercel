
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot AI</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; }
    input, textarea { width: 100%; margin: 8px 0; padding: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; }
    #output { margin-top: 15px; padding: 12px; background: #f3f4f6; border-radius: 5px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>🤖 Kamu Nenye ?</h2>
  
  <label>Groq API Key:</label>
  <input type="password" id="apiKey" placeholder="Masukkan gsk_...">

  <label>Pertanyaan:</label>
  <textarea id="prompt" placeholder="Ketik pesan..."></textarea>

  <button onclick="kirim()">Kirim </button>

  <div id="output">Jawaban akan muncul di sini...</div>

  <script>
    async function kirim() {
      const key = document.getElementById('apiKey').value.trim();
      const text = document.getElementById('prompt').value.trim();
      const out = document.getElementById('output');

      if (!key || !text) return alert("Isi API Key dan Pertanyaan!");

      out.innerText = "Kela Tungguan...";

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + key,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openai/gpt-oss-20b",
            messages: [{ role: "user", content: text }]
          })
        });

        const data = await res.json();

        if (data.choices && data.choices[0]) {
          out.innerText = data.choices[0].message.content;
        } else if (data.error) {
          out.innerText = "Error: " + data.error.message;
        } else {
          out.innerText = "Terjadi kesalahan tidak diketahui.";
        }
      } catch (err) {
        out.innerText = "Error Koneksi: " + err.message;
      }
    }
  <script>
    let history = [
  { role: "system", content: "Kamu adalah asisten AI yang ramah, pintar, dan berbahasa Indonesia." }
];
    // A. Memasukkan pesan kamu ke memori
history.push({ role: "user", content: text });

// B. Mengirim seluruh array history ke Groq
const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
  method: "POST",
  headers: { ... },
  body: JSON.stringify({
    model: "openai/gpt-oss-20b" ,
    messages: history // <-- Kirim semua riwayat di sini
  })
});

</body>
</html>
