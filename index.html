<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanya AI Groq</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; }
    input, textarea, select { width: 100%; margin: 8px 0; padding: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
    #output { margin-top: 15px; padding: 12px; background: #f3f4f6; border-radius: 5px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>

  <h2>🤖 Tanya AI Groq</h2>
  
  <label>Groq API Key (Tersimpan Otomatis):</label>
  <input type="password" id="apiKey" placeholder="Masukkan gsk_...">

  <label>Pilih Model AI:</label>
  <select id="modelSelect">
    <option value="llama-3.1-8b-instant">llama-3.1-8b-instant (Cepat)</option>
    <option value="llama3-8b-8192">llama3-8b-8192 (Stabil)</option>
    <option value="mixtral-8x7b-32768">mixtral-8x7b-32768 (Alternatif)</option>
  </select>

  <label>Pertanyaan:</label>
  <textarea id="prompt" placeholder="Ketik pesan..."></textarea>

  <button onclick="kirim()">Kirim Pesan</button>

  <div id="output">Jawaban akan muncul di sini...</div>

  <script>
    // Memuat API Key yang tersimpan saat halaman dibuka
    window.onload = function() {
      const savedKey = localStorage.getItem('groq_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }
    };

    async function kirim() {
      let key = document.getElementById('apiKey').value;
      key = key.replace(/[^\x00-\x7F]/g, "").trim(); 
      
      const text = document.getElementById('prompt').value.trim();
      const selectedModel = document.getElementById('modelSelect').value;
      const out = document.getElementById('output');

      if (!key) return alert("API Key kosong atau mengandung karakter ilegal!");
      if (!text) return alert("Ketik pertanyaanmu dulu!");

      // Simpan API Key ke memori browser
      localStorage.setItem('groq_api_key', key);

      out.innerText = "Sedang memproses...";

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + key,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: [{ role: "user", content: text }]
          })
        });

        const data = await res.json();

        if (data.choices && data.choices[0]) {
          out.innerText = data.choices[0].message.content;
        } else if (data.error) {
          out.innerText = "Error API: " + data.error.message;
        } else {
          out.innerText = "Terjadi kesalahan tidak diketahui.";
        }
      } catch (err) {
        out.innerText = "Error Koneksi: " + err.message;
      }
    }
  </script>

</body>
</html>
