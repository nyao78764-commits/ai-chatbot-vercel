<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot ku</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; padding: 20px; display: flex; justify-content: center; }
    .chat-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 15px; color: #111827; }
    .input-group { margin-bottom: 12px; }
    label { font-size: 12px; font-weight: bold; color: #4b5563; }
    input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    textarea { height: 80px; resize: none; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #93c5fd; }
    #output { margin-top: 15px; padding: 12px; background: #f3f4f6; border-radius: 6px; font-size: 14px; white-space: pre-wrap; word-break: break-word; min-height: 50px; }
  </style>
</head>
<body>

<div class="chat-container">
  <h2>🤖 Tanya AI</h2>
  
  <div class="input-group">
    <label>GROQ API KEY:</label>
    <input type="password" id="apiKey" placeholder="Masukkan gsk_...">
  </div>

  <div class="input-group">
    <label>PERTANYAAN:</label>
    <textarea id="prompt" placeholder="Ketik pertanyaanmu di sini..."></textarea>
  </div>

  <button id="btn" onclick="kirimPesan()">Kirim Pesan</button>

  <div id="output">Jawaban AI akan muncul di sini...</div>
</div>

<script>
  async function kirimPesan() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const prompt = document.getElementById('prompt').value.trim();
    const output = document.getElementById('output');
    const btn = document.getElementById('btn');

    if (!apiKey) return alert("Masukkan Groq API Key kamu dulu!");
    if (!prompt) return alert("Ketik pertanyaanmu dulu!");

    output.innerText = "Sedang berpikir...";
    btn.disabled = true;

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "llama3-8b-8192",
          messages: [{ role: "user", content: prompt }]
        })
      });

      const data = await response.json();

      if (data.choices && data.choices[0]) {
        output.innerText = data.choices[0].message.content;
      } else if (data.error) {
        output.innerText = "Error API: " + data.error.message;
      } else {
        output.innerText = "Terjadi kesalahan sistem.";
      }
    } catch (err) {
      output.innerText = "Error koneksi: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
